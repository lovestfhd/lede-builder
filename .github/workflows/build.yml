name: Build LEDE Firmware

on:
  workflow_dispatch:
    inputs:
      record:
        description: 'Record / Version tag'
        required: false
        default: 'manual'

permissions:
  contents: read

concurrency:
  group: lede-custom-board-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_COMMIT: 5b3fb1a5ee7884ff11149511a125fb87905effb0
  REPO_URL: https://github.com/coolsnowwolf/lede.git
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium
          sudo rm -rf /usr/share/swift /usr/lib/jvm /usr/local/go* /usr/local/julia*
          sudo docker system prune --all --force --volumes || true
          sudo apt-get autoremove --purge -y
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      - name: Initialize Environment
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "Updating package lists: $(date -Is)"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          echo "Installing build dependencies: $(date -Is)"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
          genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
          libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
          libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf \
          python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
          swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd xz-utils zlib1g-dev
          sudo timedatectl set-timezone "$TZ"

      - name: Clone Source Code
        run: |
          git init openwrt
          git -C openwrt remote add origin "$REPO_URL"
          git -C openwrt fetch --depth 1 origin "$SOURCE_COMMIT"
          git -C openwrt checkout --detach FETCH_HEAD
          test "$(git -C openwrt rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Apply Custom Patches
        run: |
          cd openwrt
          for p in ../patches/*.patch; do
            if [ -f "$p" ]; then
              echo "Applying $p..."
              git apply "$p"
            fi
          done

      - name: Update Feeds
        timeout-minutes: 30
        run: |
          set -o pipefail
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          cd openwrt
          df -h
          free -h
          # Bound each update attempt; do not leave a stalled fetch running forever.
          for attempt in 1 2 3; do
            echo "Feeds update attempt $attempt: $(date -Is)"
            if timeout --kill-after=30s 8m ./scripts/feeds update -a; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Install Feeds
        timeout-minutes: 15
        run: |
          cd openwrt
          ./scripts/feeds install -a
          df -h
          free -h

      - name: Load Custom Configuration
        run: |
          cp -f .config openwrt/.config
          cd openwrt
          make defconfig
          # Refuse to build if defconfig enables any other board.
          python3 ../scripts/check-single-profile.py .config
          ./scripts/diffconfig.sh > config.buildinfo

      - name: Download package
        id: package
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Prepare Artifacts
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload Firmware Directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: lede_firmware
          path: ${{ env.FIRMWARE }}
          if-no-files-found: error
